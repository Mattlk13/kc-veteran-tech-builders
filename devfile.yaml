schemaVersion: 2.3.0
metadata:
  name: kc-veteran-tech-builders
  version: 1.0.0
  description: Optional isolated Eclipse Che workspace; not a production deployment
components:
  - name: developer
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 2Gi
      mountSources: true
  - name: java25
    container:
      image: maven:3.9-eclipse-temurin-25
      memoryLimit: 2Gi
      mountSources: true
commands:
  - id: install-dependencies
    exec:
      component: developer
      workingDir: ${PROJECT_SOURCE}
      commandLine: "node --version"
  - id: validate
    exec:
      component: developer
      workingDir: ${PROJECT_SOURCE}
      commandLine: "node --check src-worker.js"
      group:
        kind: test
        isDefault: true
  - id: java-build
    exec:
      component: java25
      workingDir: ${PROJECT_SOURCE}
      commandLine: mvn -B -ntp -f training/java/pom.xml package
      group:
        kind: build
        isDefault: true
  - id: java-smoke-test
    exec:
      component: java25
      workingDir: ${PROJECT_SOURCE}
      commandLine: java -cp training/java/target/test-classes:training/java/target/classes org.kcveterantechbuilders.SyntheticEventCounterTest
